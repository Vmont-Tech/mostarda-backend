name: mostarda-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mostarda
      POSTGRES_USER: mostarda
      POSTGRES_PASSWORD: mostarda-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mostarda -d mostarda"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - mostarda_postgres_data:/var/lib/postgresql/data

volumes:
  mostarda_postgres_data:
